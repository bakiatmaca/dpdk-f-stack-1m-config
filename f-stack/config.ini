# F-Stack config.ini

[dpdk]
#CPU7 CPU6 CPU5 CPU4 CPU3 CPU2 CPU1 CPU0
#  0    0    0    0    1    1    1    1   → 0b00001111 = 0x0F

lcore_mask=0x0F
lcore_list=0,1,2,3

channel=4
numa_on=1

promiscuous=0
hugepage_dir=/dev/hugepages

allow=0000:01:00.0
port_list=0

nb_bond=0
nb_vdev=0
vlan_strip=1
tx_csum_offload_skip=0

tso=0
idle_sleep=0
pkt_tx_delay=0

symmetric_rss=1

[port0]
if_name=dpdk-x
addr=192.168.1.100
netmask=255.255.255.0
broadcast=192.168.2.255
gateway=192.168.1.1

#not required ---------
vip_ifname=dpdk-x
vip_addr=192.168.2.60;192.168.2.61;192.168.2.62;192.168.2.63;192.168.2.64;192.168.2.65;192.168.2.66;192.168.2.67;192.168.2.68;192.168.2.69;192.168.2.70;192.168.2.71;192.168.2.72;192.168.2.73;192.168.2.74;192.168.2.75;192.168.2.80;192.168.2.81;192.168.2.82;192.168.2.83;192.168.2.84;192.168.2.85;192.168.2.86;192.168.2.87;192.168.2.88;192.168.2.89;192.168.2.90;192.168.2.91;192.168.2.92;192.168.2.93;192.168.2.94;192.168.2.95
#not required ---------

[rss_check]
enable=0

[stack]
kni=0

[freebsd.boot]
hz=100
fd_reserve=1024
kern.ipc.maxsockets=2097152

net.inet.tcp.syncache.hashsize=32768
net.inet.tcp.syncache.bucketlimit=200
net.inet.tcp.syncache.cachelimit=262144
net.inet.tcp.tcbhashsize=65536

kern.ncallout=262144
kern.features.inet6=0

[freebsd.sysctl]
kern.ipc.somaxconn=65535
kern.ipc.maxsockbuf=16777216

net.inet.tcp.sendbuf_max=1048576
net.inet.tcp.recvbuf_max=1048576

net.inet.tcp.sendspace=8192
net.inet.tcp.recvspace=8192
net.inet.tcp.sendbuf_auto=0
net.inet.tcp.recvbuf_auto=0

#TCP
net.inet.tcp.delayed_ack=1
net.inet.tcp.sack.enable=1
net.inet.tcp.cc.algorithm=cubic
# rack or bbr
net.inet.tcp.functions_default=rack
#net.inet.tcp.functions_default=bbr

# HPTS (BBR/RACK)
net.inet.tcp.hpts.skip_swi=1
net.inet.tcp.hpts.minsleep=125
net.inet.tcp.hpts.maxsleep=51200

net.inet.tcp.blackhole=1
net.inet.tcp.msl=2000
net.inet.tcp.rfc1323=1
net.inet.ip.redirect=0
net.inet.ip.forwarding=0
net.inet6.ip6.forwarding=0

